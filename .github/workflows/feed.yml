name: OpenAI feed

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch: {}       # "Run workflow" button for a manual run
  push:
    paths:
      - "config.json"
      - "convert.py"

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Convert Google feed -> OpenAI CSV
        run: python convert.py

      - name: Publish (commit to docs/)
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/
          git commit -m "Feed update $(date -u +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
